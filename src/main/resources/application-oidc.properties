spring.security.oauth2.client.provider.zincc.issuer-uri=${ZINCC_OIDC_ISSUER}
spring.security.oauth2.client.registration.zincc.client-id=${ZINCC_OIDC_CLIENT_ID}
spring.security.oauth2.client.registration.zincc.client-secret=${ZINCC_OIDC_CLIENT_SECRET}
spring.security.oauth2.client.registration.zincc.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.zincc.scope=openid
spring.security.oauth2.client.registration.zincc.redirect-uri=${ZINCC_PUBLIC_BASE_URL}/login/oauth2/code/zincc
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=ZINCCSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
