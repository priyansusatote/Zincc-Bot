spring.config.import=optional:file:./.env[.properties]
zincc.models.presets.fast=lightning-free
zincc.models.presets.balanced=gemma-free,lightning-free
zincc.models.routes[0].id=gemma-free
zincc.models.routes[0].provider=openrouter
zincc.models.routes[0].model=google/gemma-4-26b-a4b-it:free
zincc.models.routes[0].output-token-limit=512
zincc.models.routes[1].id=lightning-free
zincc.models.routes[1].provider=openrouter
zincc.models.routes[1].model=nvidia/nemotron-3.5-lightning:free
zincc.models.routes[1].output-token-limit=1536
